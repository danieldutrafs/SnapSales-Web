<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSales - clientes</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/clientes.css">
</head>

<body>
    <aside class="menu-esquerdo">
        <h1>SnapSales</h1>
        <nav>
            <div class="menu-indicador" id="menu-indicador"></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="encomendas.html">Encomendas</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="clientes.html" class="ativo">Clientes</a></li>
                <li><a href="movimentacao.html">Movimentação</a></li>
            </ul>
        </nav>
    </aside>

    <main class="conteudo">
        <header>
            <h2>Gerenciamento de clientes</h2>
            <button class="btn-novo" id="btn-novo">+ Novo Cliente</button>
        </header>

        <div class="container-clientes">
            <div class="filtro-cliente">
                <input type="text" placeholder="Pesquisar Cliente">
                <div class="acoes-botoes">
                    <button id="btn-conversa">Abrir Conversa</button>
                    <button id="btn-editar">Editar</button>
                    <button id="btn-excluir">Excluir</button>
                </div>
            </div>

            <div class="tabela-clientes">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-cliente-corpo">
                        <!-- Linhas da tabela serão adicionadas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Tela 2: Novo / Editar cliente (modal) -->
    <div class="modal-fundo" id="modal-cliente" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-topo">
                <h3 id="modal-titulo">Novo Cliente</h3>
                <button type="button" class="modal-fechar" id="modal-fechar" aria-label="Fechar">&times;</button>
            </div>

            <form id="form-cliente" novalidate>
                <div class="modal-corpo">
                    <div class="campo">
                        <label for="cliente-nome">Nome:</label>
                        <input type="text" id="cliente-nome" maxlength="80" autocomplete="off">
                        <span class="erro" id="erro-nome"></span>
                    </div>
                    <div class="campo">
                        <label for="cliente-telefone">Telefone:</label>
                        <input type="text" id="cliente-telefone" placeholder="51 999999999" maxlength="12" autocomplete="off">
                        <span class="erro" id="erro-telefone"></span>
                    </div>
                    <div class="campo">
                        <label for="cliente-endereco">Endereço:</label>
                        <input type="text" id="cliente-endereco" maxlength="120" autocomplete="off">
                        <span class="erro" id="erro-endereco"></span>
                    </div>
                </div>

                <div class="modal-rodape">
                    <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar" id="btn-salvar">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/clientes.js"></script>
</body>

</html>
